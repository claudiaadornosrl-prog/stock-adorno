<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock · Claudia Adorno</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1565c0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --primary: #1565c0;
  --primary-dark: #0d47a1;
  --bg: #f6f8fb;
  --card: #ffffff;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --green-bg: #dcfce7; --green-tx: #166534;
  --red-bg: #fee2e2;   --red-tx: #991b1b;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

.header { background: var(--primary); color: white; padding: 14px 16px;
  display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 50; }
.header .title { font-size: 17px; font-weight: 700; flex: 1; }
.header .sub { font-size: 11px; opacity: 0.85; display: block; font-weight: 400; }
#btn-install { display: none; background: rgba(255,255,255,0.15); color: white;
  border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; padding: 6px 12px;
  font-size: 13px; cursor: pointer; }

.search-wrap { padding: 12px 16px; background: white; border-bottom: 1px solid var(--border);
  position: sticky; top: 58px; z-index: 40; }
.search-box { display: flex; gap: 8px; }
.search-box input { flex: 1; padding: 12px 14px; font-size: 16px; border: 2px solid var(--border);
  border-radius: 10px; outline: none; }
.search-box input:focus { border-color: var(--primary); }
.search-box button { background: var(--primary); color: white; border: none; border-radius: 10px;
  padding: 0 18px; font-size: 18px; cursor: pointer; }
.hint { font-size: 12px; color: var(--muted); margin: 8px 2px 0; }
.filtros { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.chip-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
  border: 1.5px solid var(--border); border-radius: 999px; padding: 6px 12px;
  cursor: pointer; user-select: none; background: white; color: var(--muted); }
.chip-toggle.on { border-color: var(--primary); color: var(--primary); background: #e8f0fe; font-weight: 600; }

#resultados { padding: 12px 16px 40px; max-width: 640px; margin: 0 auto; }
.card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
  padding: 14px; margin-bottom: 12px; }
.card-top { display: flex; align-items: flex-start; gap: 10px; }
.card-info { flex: 1; min-width: 0; }
.sku-chip { display: inline-block; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  font-weight: 700; background: #e8f0fe; color: var(--primary-dark); border-radius: 6px;
  padding: 2px 8px; margin-bottom: 4px; }
.desc { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; }
.desc-adic { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 3px; overflow-wrap: break-word; }
.precio { font-size: 20px; font-weight: 800; color: var(--primary); white-space: nowrap; }
.precio small { font-size: 11px; color: var(--muted); font-weight: 400; display: block; text-align: right; }
.stocks { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.stock-chip { flex: 1; min-width: 90px; text-align: center; border-radius: 10px; padding: 8px 6px;
  background: #f3f4f6; }
.stock-chip .loc { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.stock-chip .qty { font-size: 20px; font-weight: 800; margin-top: 2px; }
.stock-chip.ok  { background: var(--green-bg); } .stock-chip.ok .qty { color: var(--green-tx); }
.stock-chip.cero { background: var(--red-bg); }  .stock-chip.cero .qty { color: var(--red-tx); }
.stock-chip .live { font-size: 10px; margin-top: 2px; color: var(--muted); min-height: 12px; }
.stock-chip .live.done { color: var(--green-tx); font-weight: 700; }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.frescura { font-size: 11px; color: var(--muted); }
.btn-live { background: white; border: 1.5px solid var(--primary); color: var(--primary);
  border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-live:disabled { opacity: 0.5; }

#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
.login-card { background: white; border-radius: 16px; padding: 30px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 380px; width: 100%; }
.login-card h1 { text-align: center; font-size: 24px; margin: 0 0 4px; color: var(--primary); }
.login-card .sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 22px; }
.login-card label { font-size: 12px; font-weight: 600; color: var(--muted); display: block;
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.login-card input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 15px; margin-bottom: 14px; }
.login-card input:focus { outline: none; border-color: var(--primary); }
.login-error { color: #dc2626; font-size: 12px; margin-bottom: 8px; min-height: 16px; }
.btn-login { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px;
  font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
.btn-login:disabled { opacity: 0.5; }
#btn-logout { display: none; background: rgba(255,255,255,0.15); color: white;
  border: 1px solid rgba(255,255,255,0.4); border-radius: 8px; padding: 6px 10px;
  font-size: 13px; cursor: pointer; }

.empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; }
.empty .big { font-size: 42px; margin-bottom: 8px; }
.spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login-screen" style="display:none;">
  <div class="login-card">
    <h1>📦 Stock</h1>
    <div class="sub">Claudia Adorno · ingresá con tu cuenta del sistema</div>
    <label>Email</label>
    <input id="login-email" type="email" autocomplete="username" placeholder="tu-email@ejemplo.com">
    <label>Contraseña</label>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="login-error" id="login-error"></div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Entrar →</button>
  </div>
</div>

<div id="app" style="display:none;">
<div class="header">
  <span style="font-size:22px;">📦</span>
  <span class="title">Stock <span class="sub">Claudia Adorno · Alcorta · Unicenter · Oficina</span></span>
  <button id="btn-install">⬇ Instalar</button>
  <button id="btn-logout" onclick="doLogout()" title="Cerrar sesión">👋 Salir</button>
</div>

<div class="search-wrap">
  <div class="search-box">
    <input id="q" type="search" placeholder="SKU o descripción…" autocomplete="off" autofocus
           enterkeyhint="search">
    <button onclick="buscar()" aria-label="Buscar">🔍</button>
  </div>
  <div class="filtros">
    <span class="hint" style="margin:0;flex:1;">Escribí al menos 2 letras o números. Ej: <b>044</b> o <b>dispenser</b></span>
    <span class="chip-toggle" id="chk-constock" onclick="toggleSinStock()">🚫 Ocultar sin stock</span>
  </div>
</div>

<div id="resultados">
  <div class="empty"><div class="big">📦</div>Buscá un artículo por SKU o descripción<br>para ver stock y precio en los 3 locales.</div>
</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════
const SUPA_URL = 'https://kwwiykssrpabncpqtmwi.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3d2l5a3NzcnBhYm5jcHF0bXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjI1NTQsImV4cCI6MjA5NDkzODU1NH0.O1VhKdjPahnJJ9qXcQuSKQbnKGhsEZqYmjDEfRuRpkc';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'stock-adorno-auth' }
});

// ═══════════════════════════════════════════════════════════════════
// AUTH — mismas credenciales que el resto del sistema (RRHH)
// ═══════════════════════════════════════════════════════════════════
function mostrarLogin() {
  document.getElementById('login-screen').style.display = '';
  document.getElementById('app').style.display = 'none';
}
function mostrarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('btn-logout').style.display = '';
  setTimeout(() => document.getElementById('q').focus(), 100);
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Completá email y contraseña.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw new Error('Email o contraseña incorrectos.');
    // Verificar que sea usuario activo del sistema (RLS lo exige)
    const { error: e2 } = await sb.from('stock_articulos').select('sku').limit(1);
    if (e2) {
      await sb.auth.signOut();
      throw new Error('Tu usuario no está activo en el sistema.');
    }
    mostrarApp();
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar →';
  }
}

async function doLogout() {
  await sb.auth.signOut();
  location.reload();
}

document.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) mostrarApp(); else mostrarLogin();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none'
      && (document.activeElement?.id === 'login-email' || document.activeElement?.id === 'login-pass')) {
    doLogin();
  }
});

const LOCALES = ['alcorta', 'unicenter', 'oficina'];
const LOCAL_LABEL = { alcorta: 'Alcorta', unicenter: 'Unicenter', oficina: 'Oficina' };

const fmt$ = n => '$' + (n || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 });
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ═══════════════════════════════════════════════════════════════════
// BÚSQUEDA (snapshot en Supabase)
// ═══════════════════════════════════════════════════════════════════
let ocultarSinStock = localStorage.getItem('stock_ocultar_sin') === '1';
let ultimoResultado = null;

function toggleSinStock() {
  ocultarSinStock = !ocultarSinStock;
  localStorage.setItem('stock_ocultar_sin', ocultarSinStock ? '1' : '0');
  actualizarChipFiltro();
  if (ultimoResultado) render(ultimoResultado.articulos, ultimoResultado.q);
}
function actualizarChipFiltro() {
  document.getElementById('chk-constock').classList.toggle('on', ocultarSinStock);
}
actualizarChipFiltro();

let debounceTimer = null;
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(buscar, 450);
});
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(debounceTimer); buscar(); }
});

async function buscar() {
  const cont = document.getElementById('resultados');
  const q = document.getElementById('q').value.trim();
  if (q.length < 2) return;
  cont.innerHTML = '<div class="empty"><span class="spinner"></span></div>';

  // Sanitizar para el filtro or= de PostgREST (sin comas/paréntesis/%)
  const qSafe = q.replace(/[,()%\\]/g, ' ').trim();
  try {
    const { data, error } = await sb.from('stock_articulos')
      .select('local, sku, descripcion, descripcion_adicional, stock, precio, updated_at')
      .or(`sku.ilike.%${qSafe}%,descripcion.ilike.%${qSafe}%,descripcion_adicional.ilike.%${qSafe}%`)
      .limit(150);
    if (error) throw error;
    ultimoResultado = { articulos: agrupar(data || []), q };
    render(ultimoResultado.articulos, q);
  } catch (e) {
    cont.innerHTML = `<div class="empty">⚠️ Error: ${escHtml(e.message)}</div>`;
  }
}

function agrupar(rows) {
  // filas por (local, sku) → un artículo por sku con stock por local
  const map = {};
  for (const r of rows) {
    const a = map[r.sku] || (map[r.sku] = {
      sku: r.sku, descripcion: null, desc_adic: null, precio: null, updated_at: null, stocks: {},
    });
    a.stocks[r.local] = parseFloat(r.stock || 0);
    if (r.descripcion && !a.descripcion) a.descripcion = r.descripcion;
    if (r.descripcion_adicional && !a.desc_adic) a.desc_adic = r.descripcion_adicional;
    if (r.precio != null) a.precio = Math.max(a.precio ?? 0, parseFloat(r.precio));
    if (!a.updated_at || r.updated_at > a.updated_at) a.updated_at = r.updated_at;
  }
  return Object.values(map);
}

function frescura(iso) {
  if (!iso) return '';
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 1) return 'recién actualizado';
  if (min < 60) return `actualizado hace ${min} min`;
  const h = Math.round(min / 60);
  return `actualizado hace ${h} h`;
}

function render(articulos, q) {
  const cont = document.getElementById('resultados');
  if (ocultarSinStock) {
    articulos = articulos.filter(a => Object.values(a.stocks).some(st => st > 0));
  }
  if (!articulos.length) {
    cont.innerHTML = `<div class="empty"><div class="big">🤷</div>No encontré nada con «${escHtml(q)}».</div>`;
    return;
  }
  // Coincidencia exacta de SKU primero, después alfabético por descripción
  const qUp = q.toUpperCase();
  articulos.sort((a, b) => {
    const ea = a.sku.toUpperCase() === qUp ? 0 : 1;
    const eb = b.sku.toUpperCase() === qUp ? 0 : 1;
    if (ea !== eb) return ea - eb;
    return (a.descripcion || a.sku).localeCompare(b.descripcion || b.sku);
  });
  const top = articulos.slice(0, 30);
  cont.innerHTML = top.map(cardHtml).join('') +
    (articulos.length > 30 ? `<div class="empty">…y ${articulos.length - 30} resultados más. Afiná la búsqueda.</div>` : '');
}

function cardHtml(a) {
  const chips = LOCALES.map(l => {
    const st = a.stocks[l];
    const tiene = st !== undefined;
    const cls = !tiene ? '' : (st > 0 ? 'ok' : 'cero');
    return `<div class="stock-chip ${cls}" id="chip-${cssId(a.sku)}-${l}">
      <div class="loc">${LOCAL_LABEL[l]}</div>
      <div class="qty">${tiene ? fmtQty(st) : '—'}</div>
      <div class="live"></div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="card-top">
      <div class="card-info">
        <span class="sku-chip">${escHtml(a.sku)}</span>
        <div class="desc">${escHtml(a.descripcion || 'Sin descripción')}</div>
        ${a.desc_adic ? `<div class="desc-adic">${escHtml(a.desc_adic)}</div>` : ''}
      </div>
      <div class="precio">${a.precio != null ? fmt$(a.precio) : '—'}<small>precio de venta</small></div>
    </div>
    <div class="stocks">${chips}</div>
    <div class="card-foot">
      <span class="frescura">${frescura(a.updated_at)}</span>
      <button class="btn-live" id="live-${cssId(a.sku)}" onclick="verificarEnVivo('${escAttr(a.sku)}')">⚡ Verificar en vivo</button>
    </div>
  </div>`;
}

const fmtQty = n => Number.isInteger(n) ? String(n) : n.toFixed(2);
const cssId = s => s.replace(/[^a-zA-Z0-9_-]/g, '_');
const escAttr = s => String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');

// ═══════════════════════════════════════════════════════════════════
// VERIFICACIÓN EN VIVO (jobs stock_sku → daemons de cada local)
// ═══════════════════════════════════════════════════════════════════
async function verificarEnVivo(sku) {
  const btn = document.getElementById('live-' + cssId(sku));
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Consultando…'; }

  const hoy = new Date().toISOString().split('T')[0];
  const jobs = LOCALES.map(l => ({
    local: l, tipo: 'stock_sku', fecha: hoy, parametro: sku,
    estado: 'pendiente', solicitado_por: 'stock_pwa',
  }));

  let ids = [];
  try {
    const { data, error } = await sb.from('dragonfish_jobs').insert(jobs).select('id, local');
    if (error) throw error;
    ids = data || [];
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '⚡ Verificar en vivo'; }
    alert('No pude iniciar la consulta en vivo: ' + e.message);
    return;
  }

  for (const l of LOCALES) marcarChip(sku, l, '⏳…', false);

  const t0 = Date.now();
  const pendientes = new Set(ids.map(r => r.id));
  const porId = Object.fromEntries(ids.map(r => [r.id, r.local]));

  while (pendientes.size > 0 && (Date.now() - t0) < 60000) {
    await new Promise(r => setTimeout(r, 2500));
    try {
      const { data } = await sb.from('dragonfish_jobs')
        .select('id, estado, payload').in('id', [...pendientes]);
      for (const j of (data || [])) {
        if (j.estado === 'completado' && j.payload) {
          pendientes.delete(j.id);
          const l = porId[j.id];
          actualizarChipVivo(sku, l, j.payload);
        } else if (j.estado === 'error') {
          pendientes.delete(j.id);
          marcarChip(sku, porId[j.id], 'sin respuesta', false);
        }
      }
    } catch (_) { /* reintenta en el próximo ciclo */ }
  }
  for (const id of pendientes) marcarChip(sku, porId[id], 'sin respuesta', false);

  if (btn) { btn.disabled = false; btn.textContent = '⚡ Verificar en vivo'; }
}

function actualizarChipVivo(sku, local, payload) {
  const chip = document.getElementById(`chip-${cssId(sku)}-${local}`);
  if (!chip) return;
  const st = parseFloat(payload.stock || 0);
  chip.classList.remove('ok', 'cero');
  chip.classList.add(st > 0 ? 'ok' : 'cero');
  chip.querySelector('.qty').textContent = fmtQty(st);
  const live = chip.querySelector('.live');
  live.textContent = '✓ en vivo';
  live.classList.add('done');
}

function marcarChip(sku, local, texto, done) {
  const chip = document.getElementById(`chip-${cssId(sku)}-${local}`);
  if (!chip) return;
  const live = chip.querySelector('.live');
  live.textContent = texto;
  live.classList.toggle('done', !!done);
}

// ═══════════════════════════════════════════════════════════════════
// PWA
// ═══════════════════════════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(() => {});
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btn-install').style.display = '';
});
document.getElementById('btn-install').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('btn-install').style.display = 'none';
  } else {
    alert('En iPhone: Compartir → "Agregar a pantalla de inicio".');
  }
});
</script>
</body>
</html>
