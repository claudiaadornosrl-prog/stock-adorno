<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock · Claudia Adorno</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1565c0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --primary: #1565c0;
  --primary-dark: #0d47a1;
  --bg: #f6f8fb;
  --card: #ffffff;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --green-bg: #dcfce7; --green-tx: #166534;
  --red-bg: #fee2e2;   --red-tx: #991b1b;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

.header { background: var(--primary); color: white; padding: 14px 16px;
  display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 50; }
.header .title { font-size: 17px; font-weight: 700; flex: 1; }
.header .sub { font-size: 11px; opacity: 0.85; display: block; font-weight: 400; }
.htabs { display: flex; gap: 4px; background: rgba(255,255,255,0.18); border-radius: 10px; padding: 3px; }
.htab { border: none; background: none; color: white; font-size: 16px; padding: 7px 13px;
  border-radius: 8px; cursor: pointer; display: flex; align-items: center; }
.htab.active { background: white; color: var(--primary); }

.search-wrap { padding: 12px 16px; background: white; border-bottom: 1px solid var(--border);
  position: sticky; top: 58px; z-index: 40; }
.search-box { display: flex; gap: 8px; }
.search-box input { flex: 1; padding: 12px 14px; font-size: 16px; border: 2px solid var(--border);
  border-radius: 10px; outline: none; }
.search-box input:focus { border-color: var(--primary); }
.search-box button { background: var(--primary); color: white; border: none; border-radius: 10px;
  padding: 0 18px; font-size: 18px; cursor: pointer; }
.hint { font-size: 12px; color: var(--muted); margin: 8px 2px 0; }
.filtros { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.chip-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
  border: 1.5px solid var(--border); border-radius: 999px; padding: 6px 12px;
  cursor: pointer; user-select: none; background: white; color: var(--muted); }
.chip-toggle.on { border-color: var(--primary); color: var(--primary); background: #e8f0fe; font-weight: 600; }

#resultados { padding: 12px 16px 40px; max-width: 640px; margin: 0 auto; }
.card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
  padding: 14px; margin-bottom: 12px; }
.card-top { display: flex; align-items: flex-start; gap: 10px; }
.thumb { flex: 0 0 116px; width: 116px; height: 116px; border-radius: 10px; overflow: hidden;
  background: white; border: 1px solid var(--border); display: none; }
.thumb.has { display: block; }
.thumb img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
.card-info { flex: 1; min-width: 0; }
.sku-chip { display: inline-block; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  font-weight: 700; background: #e8f0fe; color: var(--primary-dark); border-radius: 6px;
  padding: 2px 8px; margin-bottom: 4px; }
.desc { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; }
.desc-adic { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 3px; overflow-wrap: break-word; }
.proveedor { display: inline-block; font-size: 11px; color: var(--muted); margin-top: 5px;
  background: #f3f4f6; border-radius: 6px; padding: 2px 8px; }
.precio { font-size: 20px; font-weight: 800; color: var(--primary); white-space: nowrap; }
.precio small { font-size: 11px; color: var(--muted); font-weight: 400; display: block; text-align: right; }
.stocks { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.stock-chip { flex: 1; min-width: 64px; text-align: center; border-radius: 8px; padding: 5px 4px;
  background: #f3f4f6; }
.stock-chip .loc { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.stock-chip .qty { font-size: 16px; font-weight: 800; margin-top: 1px; }
.stock-chip.ok  { background: var(--green-bg); } .stock-chip.ok .qty { color: var(--green-tx); }
.stock-chip.cero { background: var(--red-bg); }  .stock-chip.cero .qty { color: var(--red-tx); }
.stock-chip .live { font-size: 10px; margin-top: 2px; color: var(--muted); min-height: 12px; }
.stock-chip .live.done { color: var(--green-tx); font-weight: 700; }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.frescura { font-size: 11px; color: var(--muted); }
.btn-live { background: white; border: 1.5px solid var(--primary); color: var(--primary);
  border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-live:disabled { opacity: 0.5; }

#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
.login-card { background: white; border-radius: 16px; padding: 30px 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 380px; width: 100%; }
.login-card h1 { text-align: center; font-size: 24px; margin: 0 0 4px; color: var(--primary); }
.login-card .sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 22px; }
.login-card label { font-size: 12px; font-weight: 600; color: var(--muted); display: block;
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.login-card input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 15px; margin-bottom: 14px; }
.login-card input:focus { outline: none; border-color: var(--primary); }
.login-error { color: #dc2626; font-size: 12px; margin-bottom: 8px; min-height: 16px; }
.btn-login { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px;
  font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
.btn-login:disabled { opacity: 0.5; }
.kebab-wrap { position: relative; }
#kebab-btn { background: white; color: var(--text); border: 2px solid var(--border); border-radius: 10px;
  padding: 0 14px; font-size: 20px; cursor: pointer; height: 100%; min-height: 46px; }
.kebab-menu { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: white;
  border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  min-width: 190px; z-index: 60; padding: 6px; }
.kebab-menu.open { display: block; }
.kebab-menu button { display: block; width: 100%; text-align: left; background: white; border: none;
  border-radius: 6px; padding: 10px; font-size: 14px; cursor: pointer; color: var(--text); }
.kebab-menu button:hover { background: #f3f4f6; }
.kebab-menu button.on { background: #e8f0fe; color: var(--primary); font-weight: 600; }
.thumb.nofoto { display: flex; align-items: center; justify-content: center;
  border: 2px dashed #f59e0b; background: #fffbeb; cursor: pointer; font-size: 34px; }
.thumb.nofoto:hover { background: #fef3c7; }
#view-espalma { padding: 14px 16px 40px; max-width: 760px; margin: 0 auto; }
.esp-wrap { overflow-x: auto; border-radius: 12px; box-shadow: var(--shadow); }
.esp-tabla { width: 100%; border-collapse: collapse; background: white; font-size: 13px; }
.esp-tabla th { background: var(--primary); color: white; padding: 10px 9px; text-align: left;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
.esp-tabla td { padding: 10px 9px; border-top: 1px solid var(--border); vertical-align: top; }
.esp-tabla tr:nth-child(even) td { background: #f9fafb; }
.esp-modelo { font-weight: 700; }
.esp-nota { font-size: 11px; color: var(--muted); }
.esp-precio { font-weight: 800; color: var(--primary); white-space: nowrap; }
.btn-edit-row { background: none; border: 1px solid var(--border); border-radius: 6px;
  padding: 3px 8px; font-size: 12px; cursor: pointer; }
#esp-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  z-index: 80; align-items: center; justify-content: center; padding: 16px; }
#esp-modal-bg.open { display: flex; }
.esp-modal { background: white; border-radius: 14px; padding: 20px; width: 100%; max-width: 420px;
  max-height: 90vh; overflow-y: auto; }
.esp-modal label { font-size: 11px; font-weight: 600; color: var(--muted); display: block;
  margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.esp-modal input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }

.esp-fila-click { cursor: pointer; }
.esp-fila-click:hover td { background: #eef4fd !important; }
.espstock-tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
.espstock-tabla th { font-size: 10px; text-transform: uppercase; color: var(--muted);
  text-align: center; padding: 6px 4px; border-bottom: 1px solid var(--border); }
.espstock-tabla th:first-child { text-align: left; }
.espstock-tabla td { padding: 7px 4px; border-bottom: 1px solid #f3f4f6; text-align: center;
  font-weight: 700; }
.espstock-tabla td:first-child { text-align: left; font-weight: 500; }
.n-ok { color: var(--green-tx); }
.n-cero { color: var(--red-tx); opacity: 0.7; }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111827;
  color: white; padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 100;
  opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; }

.empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; }
.empty .big { font-size: 42px; margin-bottom: 8px; }
.spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login-screen" style="display:none;">
  <div class="login-card">
    <h1>📦 Stock</h1>
    <div class="sub">Claudia Adorno · ingresá con tu cuenta del sistema</div>
    <label>Email</label>
    <input id="login-email" type="email" autocomplete="username" placeholder="tu-email@ejemplo.com">
    <label>Contraseña</label>

<div class="header">

  <div class="htabs">
    <button class="htab active" id="tab-stock" onclick="verTab('stock')" title="Buscador de stock" aria-label="Stock">🔍</button>

<div id="view-stock">
<div class="search-wrap">

           enterkeyhint="search">

    <div class="kebab-wrap">
      <button id="kebab-btn" onclick="toggleKebab(event)" title="Menú" aria-label="Menú">⋮</button>
      <div class="kebab-menu" id="kebab-menu">
        <button id="btn-install" style="display:none;">⬇ Instalar la app</button>
        <button id="mi-exacto" onclick="toggleExacto()">🎯 Solo resultado exacto</button>
        <button id="mi-constock" onclick="toggleSinStock()">🚫 Ocultar sin stock</button>
        <button onclick="doLogout()">👋 Cerrar sesión</button>
      </div>
    </div>
  </div>
</div>

<div id="resultados">
  <div class="empty"><div class="big">📦</div>Buscá un artículo por SKU o descripción<br>para ver stock y precio en los 3 locales.</div>
</div>
</div>

<div id="view-espalma" style="display:none;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;">
    <div id="listas-chips" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    <button class="btn-live" id="btn-esp-add" style="display:none;" onclick="abrirEspalmaEdit(null)" title="Agregar modelo">＋</button>
  </div>

<div id="scan-modal-bg" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:90; flex-direction:column; align-items:center; justify-content:center; gap:14px;">
  <video id="scan-video" autoplay playsinline style="width:92%; max-width:480px; border-radius:14px;"></video>

<div id="tras-modal-bg" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:85; align-items:center; justify-content:center; padding:16px;">
  <div style="background:white; border-radius:14px; padding:18px; width:100%; max-width:360px;">
    <h3 id="tras-titulo" style="margin:0 0 4px; font-size:16px;"></h3>
    <div id="tras-desc" style="font-size:13px; color:var(--muted); margin-bottom:12px;"></div>
    <label style="font-size:13px; font-weight:600;">Cantidad</label>
    <input id="tras-cant" type="number" min="1" value="1" inputmode="numeric" style="width:100%; padding:10px; font-size:16px; border:2px solid var(--border); border-radius:10px; margin:4px 0 14px; box-sizing:border-box;">

  <div style="background:white; border-radius:14px; padding:18px; width:100%; max-width:380px;">
    <h3 id="trasresp-titulo" style="margin:0 0 6px; font-size:16px;"></h3>
    <div id="trasresp-desc" style="font-size:13px; color:var(--muted); margin-bottom:12px; white-space:pre-line;"></div>
    <div id="trasresp-info" style="display:none; font-size:13px; background:#fef9c3; color:#854d0e; border-radius:8px; padding:8px 10px; margin-bottom:12px;"></div>
    <div id="trasresp-etapa1" style="display:none;">
      <button class="btn-login" onclick="marcarRevisando()">👀 Estoy revisando</button>
      <div style="font-size:11px; color:var(--muted); margin-top:6px; text-align:center;">Le avisa a quien lo pidió que alguien lo está buscando</div>
    </div>
    <div id="trasresp-etapa2" style="display:none; gap:8px;">
      <button class="btn-login" style="flex:1; background:#16a34a;" onclick="responderTraslado(true)">✅ Está, lo guardo</button>
      <button class="btn-login" style="flex:1; background:#dc2626;" onclick="responderTraslado(false)">❌ No está</button>

  <div class="esp-modal">

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════
const SUPA_URL = 'https://kwwiykssrpabncpqtmwi.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3d2l5a3NzcnBhYm5jcHF0bXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjI1NTQsImV4cCI6MjA5NDkzODU1NH0.O1VhKdjPahnJJ9qXcQuSKQbnKGhsEZqYmjDEfRuRpkc';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'stock-adorno-auth' }
});

// ═══════════════════════════════════════════════════════════════════
// AUTH — mismas credenciales que el resto del sistema (RRHH)
// ═══════════════════════════════════════════════════════════════════
function mostrarLogin() {
  document.getElementById('login-screen').style.display = '';
  document.getElementById('app').style.display = 'none';
  // Precargar credenciales recordadas
  try {
    const rec = JSON.parse(localStorage.getItem('stock_credenciales') || 'null');
    if (rec?.email) {
      document.getElementById('login-email').value = rec.email;
      document.getElementById('login-pass').value = rec.pass || '';
      document.getElementById('login-recordar').checked = true;
    }
  } catch (_) {}
}
function mostrarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
  detectarAdmin();
  chequearTrasladoURL();
  setTimeout(() => document.getElementById('q').focus(), 100);
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Completá email y contraseña.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw new Error('Email o contraseña incorrectos.');
    // Verificar que sea usuario activo del sistema (RLS lo exige)
    const { error: e2 } = await sb.from('stock_articulos').select('sku').limit(1);
    if (e2) {
      await sb.auth.signOut();
      throw new Error('Tu usuario no está activo en el sistema.');
    }
    // Recordar (o borrar) credenciales según el checkbox
    if (document.getElementById('login-recordar').checked) {
      localStorage.setItem('stock_credenciales', JSON.stringify({ email, pass }));
    } else {

async function actualizarPreciosEspalma() {
  // Toma el precio real y actual de los articulos que matchean el patron.
  // Solo la categoria visible (79 filas totales = mucha consulta al pedo)
  // y solo las que no se consultaron todavia en esta sesion.
  const conPatron = espCache.filter(m => m.patron
    && (m.categoria || 'espalma') === listaCat && !m._precios_ok);
  if (!conPatron.length) return;
  conPatron.forEach(m => { m._precios_ok = true; });
  try {
    const resultados = await Promise.all(conPatron.map(m =>
      sb.from('stock_articulos').select('sku, local, stock, precio')
        .ilike('descripcion', m.patron).limit(400)
    ));
    let cambio = false;
    conPatron.forEach((m, idx) => {
      const filas = resultados[idx].data || [];
      if (!filas.length) return;
      // Precio mas frecuente (filas de alcorta con precio cargado)
      const cuenta = {};
      for (const f of filas) if (f.local === 'alcorta' && f.precio > 0)
        cuenta[f.precio] = (cuenta[f.precio] || 0) + 1;
      const ordenadas = Object.entries(cuenta).sort((a, b) => b[1] - a[1]);
      if (ordenadas.length) {
        const precio = parseFloat(ordenadas[0][0]);
        if (precio && precio !== parseFloat(m.precio)) { m.precio = precio; cambio = true; }
      }
      // Colores (SKUs) con stock en algun local
      const porSku = {};
      for (const f of filas) porSku[f.sku] = (porSku[f.sku] || 0) + parseFloat(f.stock || 0);
      const n = Object.values(porSku).filter(t => t > 0).length;
      if (m.colores_stock !== n) { m.colores_stock = n; cambio = true; }
    });
    if (cambio) renderEspalma();
  } catch (_) { /* si falla, quedan los precios guardados */ }
}

async function mostrarStockPorColor(titulo, patron) {
  document.getElementById('espstock-titulo').textContent = titulo + ' · stock por color';
  const cont = document.getElementById('espstock-contenido');
  cont.innerHTML = '<div style="text-align:center;padding:24px;"><span class="spinner"></span></div>';
  document.getElementById('espstock-modal-bg').style.display = 'flex';
  try {
    const { data, error } = await sb.from('stock_articulos')
      .select('sku, descripcion, local, stock')
      .ilike('descripcion', patron)
      .limit(400);
    if (error) throw error;
    // Agrupar por sku
    const map = {};
    for (const r of (data || [])) {
      const a = map[r.sku] || (map[r.sku] = { sku: r.sku, desc: r.descripcion || r.sku, stocks: {} });
      a.stocks[r.local] = parseFloat(r.stock || 0);
    }
    let items = Object.values(map);
    // Solo colores con stock en algun local
    items = items.filter(i => Object.values(i.stocks).some(st => st > 0));
    if (!items.length) {
      cont.innerHTML = '<div class="empty">Sin stock en ningún color por el momento.</div>';
      return;
    }
    // Sacar el prefijo común de palabras para mostrar solo el color
    const listas = items.map(i => i.desc.split(/\s+/));
    let nComunes = 0;
    while (listas.every(w => w.length > nComunes + 1 && w[nComunes] === listas[0][nComunes])) nComunes++;
    for (const i of items) {
      i.color = i.desc.split(/\s+/).slice(nComunes).join(' ') || i.desc;
    }
    items.sort((a, b) => a.color.localeCompare(b.color));
    const celda = st => st === undefined ? '<td>—</td>'
      : `<td class="${st > 0 ? 'n-ok' : 'n-cero'}">${Number.isInteger(st) ? st : st.toFixed(1)}</td>`;
    cont.innerHTML = `<div style="max-height:60vh;overflow-y:auto;"><table class="espstock-tabla">
      <thead><tr><th>Color</th><th>Alcorta</th><th>Unicenter</th><th>Oficina</th></tr></thead>
      <tbody>${items.map(i => `<tr>
        <td title="${escHtml(i.sku)}">${escHtml(i.color)}</td>
        ${celda(i.stocks.alcorta)}${celda(i.stocks.unicenter)}${celda(i.stocks.oficina)}
      </tr>`).join('')}</tbody>
    </table></div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px;">${items.length} colores con stock · tocá el nombre para ver el SKU</div>`;
  } catch (e) {
    cont.innerHTML = `<div class="empty">⚠️ ${escHtml(e.message)}</div>`;
  }
}

async function buscar() {
  const cont = document.getElementById('resultados');
  const q = document.getElementById('q').value.trim();
  if (q.length < 2) return;
  cont.innerHTML = '<div class="empty"><span class="spinner"></span></div>';

  // Sanitizar para el filtro or= de PostgREST (sin comas/paréntesis/%)
  const qSafe = q.replace(/[,()%\\]/g, ' ').trim();
  try {
    const { data, error } = await sb.from('stock_articulos')
      .select('local, sku, descripcion, descripcion_adicional, proveedor, stock, precio, updated_at, discontinuado')
      .or(`sku.ilike.%${qSafe}%,descripcion.ilike.%${qSafe}%,descripcion_adicional.ilike.%${qSafe}%`)
      .limit(150);
    if (error) throw error;
    ultimoResultado = { articulos: agrupar(data || []), q };
    if ((data || []).length) guardarReciente(q);
    render(ultimoResultado.articulos, q);
  } catch (e) {
    cont.innerHTML = `<div class="empty">⚠️ Error: ${escHtml(e.message)}</div>`;
  }
}

function agrupar(rows) {
  // filas por (local, sku) → un artículo por sku con stock por local
  const map = {};
  for (const r of rows) {
    const a = map[r.sku] || (map[r.sku] = {
      sku: r.sku, descripcion: null, desc_adic: null, proveedor: null, precio: null, updated_at: null, stocks: {}, discontinuado: false,
    });
    a.stocks[r.local] = parseFloat(r.stock || 0);
    if (r.discontinuado) a.discontinuado = true;
    if (r.descripcion && !a.descripcion) a.descripcion = r.descripcion;
    if (r.descripcion_adicional && !a.desc_adic) a.desc_adic = r.descripcion_adicional;
    if (r.proveedor && !a.proveedor) a.proveedor = r.proveedor;
    if (r.precio != null) a.precio = Math.max(a.precio ?? 0, parseFloat(r.precio));
    if (!a.updated_at || r.updated_at > a.updated_at) a.updated_at = r.updated_at;
  }
  return Object.values(map);
}

function frescura(iso) {
  if (!iso) return '';
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 1) return 'recién actualizado';
  if (min < 60) return `actualizado hace ${min} min`;
  const h = Math.round(min / 60);
  return `actualizado hace ${h} h`;
}

function render(articulos, q) {
  const cont = document.getElementById('resultados');
  if (soloExacto && q) {
    const qUp2 = q.toUpperCase();
    articulos = articulos.filter(a => a.sku.toUpperCase() === qUp2);
  }
  if (ocultarSinStock) {
    articulos = articulos.filter(a => Object.values(a.stocks).some(st => st > 0));
  }
  if (!articulos.length) {
    cont.innerHTML = `<div class="empty"><div class="big">🤷</div>No encontré nada con «${escHtml(q)}».</div>`;
    return;
  }
  // Coincidencia exacta de SKU primero, después alfabético por descripción
  const qUp = q.toUpperCase();
  articulos.sort((a, b) => {
    const ea = a.sku.toUpperCase() === qUp ? 0 : 1;
    const eb = b.sku.toUpperCase() === qUp ? 0 : 1;
    if (ea !== eb) return ea - eb;
    return (a.descripcion || a.sku).localeCompare(b.descripcion || b.sku);
  });
  const top = articulos.slice(0, 30);
  cont.innerHTML = top.map(cardHtml).join('') +
    (articulos.length > 30 ? `<div class="empty">…y ${articulos.length - 30} resultados más. Afiná la búsqueda.</div>` : '');
  cargarImagenes(top.map(a => a.sku), new Set(top.filter(a => a.discontinuado).map(a => a.sku)));
}

async function cargarImagenes(skus, descontinuados) {
  if (!skus.length) return;
  let conFoto = new Set();
  try {
    const { data } = await sb.from('stock_imagenes').select('sku, url').in('sku', skus);
    for (const r of (data || [])) {
      conFoto.add(r.sku);
      imgUrls[r.sku] = r.url;
      const div = document.getElementById('img-' + cssId(r.sku));
      if (div) {
        div.innerHTML = `<img src="${r.url}" loading="lazy" alt="" onclick="window.open('${r.url}', '_blank')">`;
        div.classList.add('has');
      }
    }
  } catch (_) { /* sin imágenes, no pasa nada */ }
  // Los que quedaron sin foto → cámara en el hueco de la imagen para pedirla
  // (salvo discontinuados: no tiene sentido pedirles foto)
  for (const sku of skus) {
    if (!conFoto.has(sku) && !(descontinuados && descontinuados.has(sku))) {
      const div = document.getElementById('img-' + cssId(sku));
      if (div) {
        div.innerHTML = '📷';
        div.classList.add('nofoto');
        div.title = 'Sin foto — tocá para pedirle a Oficina que la suba';
        div.onclick = () => solicitarImagen(sku);
      }
    }
  }
}

// ── Solicitar imagen: push a Marisa y Analía (Oficina) ──
const EMPLEADAS_IMAGENES = [1, 5];  // Marisa Contreras · Analía Rivera

async function solicitarImagen(sku) {
  const btn = document.getElementById('img-' + cssId(sku));
  if (btn) { btn.onclick = null; btn.innerHTML = '⏳'; }
  try {
    const art = (ultimoResultado?.articulos || []).find(a => a.sku === sku);
    const desc = art?.descripcion ? ` (${art.descripcion})` : '';
    for (const empId of EMPLEADAS_IMAGENES) {
      await sb.functions.invoke('enviar-push', {
        body: {
          empleado_id: empId,
          title: '📷 Falta imagen de producto',
          body: `Al SKU ${sku}${desc} le falta imagen. ¿La subís al Drive?`,
          tag: 'img-' + sku,
        }
      });
    }
    toast('📷 Listo — le avisamos a Oficina que falta la foto de ' + sku);
    if (btn) { btn.innerHTML = '✓'; btn.title = 'Foto pedida a Oficina'; }
  } catch (e) {
    toast('No pude enviar la solicitud: ' + (e.message || e));
    if (btn) { btn.innerHTML = '📷'; btn.onclick = () => solicitarImagen(sku); }

}

function compartirWA(sku) {
  const a = (ultimoResultado?.articulos || []).find(x => x.sku === sku);
  if (!a) return;
  let txt = `*${a.descripcion || sku}*`;
  if (a.desc_adic) txt += `\n${a.desc_adic}`;
  if (a.precio != null) txt += `\n💲 ${fmt$(a.precio)}`;
  if (imgUrls[sku]) txt += `\n${imgUrls[sku]}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
}

// ── Ver otros colores / variantes ──
async function verColores(sku) {
  const a = (ultimoResultado?.articulos || []).find(x => x.sku === sku);
  if (!a || !a.descripcion) return;
  const palabras = a.descripcion.trim().replace(/[%_]/g, '').split(/\s+/);
  toast('🎨 Buscando variantes…');
  // Recorta palabras del final (color, códigos) hasta encontrar 2+ variantes con stock
  for (let n = palabras.length - 1; n >= 1; n--) {
    const base = palabras.slice(0, n).join(' ');
    if (base.length < 4) break;
    try {
      const { data } = await sb.from('stock_articulos')
        .select('sku, stock').ilike('descripcion', base + '%').limit(400);
      const porSku = {};
      for (const f of (data || [])) porSku[f.sku] = (porSku[f.sku] || 0) + parseFloat(f.stock || 0);
      const conStock = Object.values(porSku).filter(t => t > 0).length;
      if (conStock >= 2) { mostrarStockPorColor(base, base + '%'); return; }
    } catch (_) { break; }
  }
  toast('No encontré otras variantes con stock de este artículo.');
}

// ── Lector de código de barras ──
// Nativo (BarcodeDetector, Android) con fallback ZXing (iPhone / desktop).
let scanStream = null, scanTimer = null, zxingReader = null, scanCancelado = false;

function cargarScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res;
    el.onerror = () => rej(new Error('No pude cargar el lector de códigos. ¿Hay internet?'));
    document.head.appendChild(el);
  });
}

async function abrirScanner() {
  const bg = document.getElementById('scan-modal-bg');
  const video = document.getElementById('scan-video');
  scanCancelado = false;
  bg.style.display = 'flex';
  try {
    if ('BarcodeDetector' in window) {
      // Camino nativo (Chrome Android)
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = scanStream;
      let formatos = ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'itf'];
      try {
        const sop = await BarcodeDetector.getSupportedFormats();
        formatos = formatos.filter(f => sop.includes(f));
      } catch (_) {}
      const detector = new BarcodeDetector({ formats: formatos });
      scanTimer = setInterval(async () => {
        if (video.readyState < 2) return;
        try {
          const codes = await detector.detect(video);
          if (codes.length) {
            const valor = (codes[0].rawValue || '').trim();
            if (!valor) return;
            usarCodigo(valor);
          }
        } catch (_) { /* frame malo, sigue */ }
      }, 250);
    } else {
      // Fallback ZXing (iPhone / Safari / desktop)
      if (!window.ZXing) await cargarScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
      zxingReader = new ZXing.BrowserMultiFormatReader();
      const result = await zxingReader.decodeOnceFromConstraints(
        { video: { facingMode: 'environment' } }, video);
      const valor = (result?.getText() || '').trim();
      if (valor) usarCodigo(valor);
      else cerrarScanner();
    }
  } catch (e) {
    const cancelado = scanCancelado;
    cerrarScanner();
    if (cancelado) return;
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
      toast('Permiso de cámara denegado. En iPhone: Ajustes → Safari → Cámara → Permitir. Si usás la app instalada, borrala y volvé a instalarla para que pida permiso.');
    } else if (e && e.name === 'NotFoundError') {
      toast('No encontré cámara en este dispositivo.');
    } else {
      toast('No pude acceder a la cámara: ' + (e.message || e));
    }
  }
}

function usarCodigo(valor) {
  if (navigator.vibrate) navigator.vibrate(80);
  cerrarScanner();
  document.getElementById('q').value = valor;
  buscar();
}

function cerrarScanner() {
  scanCancelado = true;
  clearInterval(scanTimer); scanTimer = null;
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  if (zxingReader) { try { zxingReader.reset(); } catch (_) {} zxingReader = null; }
  document.getElementById('scan-modal-bg').style.display = 'none';
}

// ── Pedido de traslado entre locales ──
let _nombreCache;
async function nombrePropio() {
  if (_nombreCache !== undefined) return _nombreCache;
  let nombre = '';
  try {
    const { data: u } = await sb.rpc('rrhh_current_user');
    if (u?.empleado_id) {
      const { data: e } = await sb.from('rrhh_empleados')
        .select('nombre, apellido').eq('id', u.empleado_id).single();
      if (e) {
        const primero = (e.nombre || '').trim().split(/\s+/)[0] || '';
        nombre = (primero + ' ' + (e.apellido || '')).trim().toLowerCase()
          .replace(/(^|\s)\S/g, c => c.toUpperCase());
      }
    }
  } catch (_) {}
  if (!nombre) {
    try { nombre = (await sb.auth.getUser()).data?.user?.email || ''; } catch (_) {}
  }
  return (_nombreCache = nombre);
}

let trasladoActual = null;
function abrirTraslado(sku, local) {
  const a = (ultimoResultado?.articulos || []).find(x => x.sku === sku);
  trasladoActual = { sku, local, desc: a?.descripcion || '' };
  document.getElementById('tras-titulo').textContent = '🔁 Pedir a ' + LOCAL_LABEL[local];
  document.getElementById('tras-desc').textContent = sku + (a?.descripcion ? ' · ' + a.descripcion : '');
  document.getElementById('tras-cant').value = 1;
  document.getElementById('tras-modal-bg').style.display = 'flex';
}
function cerrarTraslado() {
  document.getElementById('tras-modal-bg').style.display = 'none';
  trasladoActual = null;
}
async function enviarTraslado() {
  if (!trasladoActual) return;
  const { sku, local, desc } = trasladoActual;
  const cant = parseInt(document.getElementById('tras-cant').value) || 1;
  cerrarTraslado();
  let quien = '', empId = null;
  try { quien = (await sb.auth.getUser()).data?.user?.email || ''; } catch (_) {}
  try { empId = (await sb.rpc('rrhh_current_user')).data?.empleado_id ?? null; } catch (_) {}
  const nombre = await nombrePropio();
  try {
    const { data: fila, error } = await sb.from('stock_traslados').insert({
      sku, descripcion: desc, cantidad: cant, local_origen: local,
      solicitante_email: quien, solicitante_empleado_id: empId, solicitante_nombre: nombre,
    }).select('id').single();
    if (error) throw error;
    const cuerpo = `¿Tienen ${cant} × ${sku}${desc ? ' (' + desc + ')' : ''} para apartar?${nombre ? ' Pide ' + nombre : ''}`;
    await sb.functions.invoke('enviar-push', {
      body: {
        local_todos: local,
        title: '🔁 Pedido de traslado',
        body: cuerpo,
        tag: 'tras-' + fila.id,
        url: 'https://claudiaadornosrl-prog.github.io/stock-adorno/?traslado=' + fila.id,
      }
    });
    toast('📣 Pedido enviado a ' + LOCAL_LABEL[local] + ' — te llega push cuando respondan');
  } catch (e) {
    toast('No pude enviar el pedido: ' + (e.message || e));
  }
}

// ── Responder un pedido de traslado (se abre al tocar la notificación) ──
let trasladoResp = null;

function abrirModalRespuesta(t, miNombre) {
  trasladoResp = t;
  const solicitante = t.solicitante_nombre || t.solicitante_email;
  document.getElementById('trasresp-titulo').textContent = '🔁 Pedido de traslado';
  document.getElementById('trasresp-desc').textContent =
    `${t.cantidad} × ${t.sku}${t.descripcion ? ' · ' + t.descripcion : ''}` +
    (solicitante ? `\nPide: ${solicitante}` : '');
  const info = document.getElementById('trasresp-info');
  const e1 = document.getElementById('trasresp-etapa1');
  const e2 = document.getElementById('trasresp-etapa2');
  if (t.estado === 'pendiente') {
    info.style.display = 'none';
    e1.style.display = 'block';
    e2.style.display = 'none';
  } else {
    // Ya lo está revisando alguien → mostrar quién y dejar confirmar
    const esMio = miNombre && t.revisando_por === miNombre;
    info.textContent = esMio ? '👀 Lo estás revisando vos — confirmá cuando sepas.'
      : `👀 Lo está revisando ${t.revisando_por || 'otra compañera'}.`;
    info.style.display = 'block';
    e1.style.display = 'none';
    e2.style.display = 'flex';
  }
  document.getElementById('trasresp-modal-bg').style.display = 'flex';
}

async function chequearTrasladoURL() {
  const id = new URLSearchParams(location.search).get('traslado');
  if (!id) return;
  history.replaceState(null, '', location.pathname);
  try {
    const { data: t, error } = await sb.from('stock_traslados').select('*').eq('id', id).single();
    if (error || !t) throw new Error('No encontré el pedido de traslado.');
    if (t.estado === 'apartado' || t.estado === 'sin_stock') {
      toast(`Este pedido ya fue respondido (${t.estado === 'apartado' ? '✅ guardado' : '❌ sin stock'}${t.respondido_por ? ' por ' + t.respondido_por : ''})`);
      return;
    }
    abrirModalRespuesta(t, await nombrePropio());
  } catch (e) {
    toast('' + (e.message || e));
  }
}

async function marcarRevisando() {
  if (!trasladoResp) return;
  const t = trasladoResp;
  const quien = await nombrePropio();
  try {
    const { data: filas, error } = await sb.from('stock_traslados')
      .update({ estado: 'revisando', revisando_por: quien, revisando_at: new Date().toISOString() })
      .eq('id', t.id).eq('estado', 'pendiente').select('id');
    if (error) throw error;
    if (!filas || !filas.length) {
      // Otra compañera lo agarró un segundo antes → recargar estado
      const { data: t2 } = await sb.from('stock_traslados').select('*').eq('id', t.id).single();
      if (t2) abrirModalRespuesta(t2, quien);
      return;
    }
    t.estado = 'revisando'; t.revisando_por = quien;
    abrirModalRespuesta(t, quien);
    if (t.solicitante_empleado_id) {
      await sb.functions.invoke('enviar-push', {
        body: {
          empleado_id: t.solicitante_empleado_id,
          title: '👀 Están revisando tu pedido',
          body: `${LOCAL_LABEL[t.local_origen]}: ${quien || 'una compañera'} está buscando ${t.cantidad} × ${t.sku}`,
          tag: 'tras-' + t.id,
        }
      });
    }
    toast('👀 Marcado — le avisamos a quien lo pidió que lo estás buscando');
  } catch (e) {
    toast('No pude marcarlo: ' + (e.message || e));
  }
}
async function responderTraslado(tiene) {
  if (!trasladoResp) return;
  const t = trasladoResp;
  document.getElementById('trasresp-modal-bg').style.display = 'none';
  trasladoResp = null;
  const quien = await nombrePropio();
  const estado = tiene ? 'apartado' : 'sin_stock';
  try {
    const { error } = await sb.from('stock_traslados')
      .update({ estado, respondido_por: quien, respondido_at: new Date().toISOString() })
      .eq('id', t.id).in('estado', ['pendiente', 'revisando']);
    if (error) throw error;
    if (t.solicitante_empleado_id) {
      await sb.functions.invoke('enviar-push', {
        body: {
          empleado_id: t.solicitante_empleado_id,
          title: tiene ? '✅ Te lo guardaron' : '❌ No está la mercadería',
          body: `${LOCAL_LABEL[t.local_origen]}: ${tiene ? 'te guardaron' : 'no encontraron'} ${t.cantidad} × ${t.sku}${quien ? ' · respondió ' + quien : ''}`,
          tag: 'tras-' + t.id,
        }
      });
    }
    toast(tiene ? '✅ Guardado — le avisamos a quien lo pidió' : 'Marcado como no está — le avisamos a quien lo pidió');
  } catch (e) {
    toast('No pude guardar la respuesta: ' + (e.message || e));
  }
}

function cardHtml(a) {
  const chips = LOCALES.map(l => {
    const st = a.stocks[l];
    const tiene = st !== undefined;
    const cls = !tiene ? '' : (st > 0 ? 'ok' : 'cero');
    return `<div class="stock-chip ${cls}" id="chip-${cssId(a.sku)}-${l}" ${tiene && st > 0 ? `onclick="abrirTraslado('${escAttr(a.sku)}','${l}')" style="cursor:pointer;" title="Pedir traslado desde ${LOCAL_LABEL[l]}"` : ''}>
      <div class="loc">${LOCAL_LABEL[l]}</div>
      <div class="qty">${tiene ? fmtQty(st) : '—'}</div>
      <div class="live"></div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="card-top">
      <div class="thumb" id="img-${cssId(a.sku)}"></div>
      <div class="card-info">
        <span class="sku-chip">${escHtml(a.sku)}</span>
        <div class="desc">${escHtml(a.descripcion || 'Sin descripción')}</div>
        ${a.desc_adic ? `<div class="desc-adic">${escHtml(a.desc_adic)}</div>` : ''}
        ${a.proveedor ? `<div class="proveedor">🏷 ${escHtml(a.proveedor)}</div>` : ''}
      </div>
      <div class="precio">${a.precio != null ? fmt$(a.precio) : '—'}<small>precio de venta</small></div>
    </div>
    <div class="stocks">${chips}</div>
    <div class="card-foot">
      <span class="frescura">${frescura(a.updated_at)}</span>
      <span style="display:flex;gap:6px;">
        ${(a.descripcion || '').trim().split(/\s+/).length > 1 ? `<button class="btn-live" onclick="verColores('${escAttr(a.sku)}')" title="Ver otros colores / variantes">🎨</button>` : ''}
        <button class="btn-live" onclick="compartirWA('${escAttr(a.sku)}')" title="Compartir por WhatsApp">${WA_SVG}</button>
        <button class="btn-live" id="live-${cssId(a.sku)}" onclick="verificarEnVivo('${escAttr(a.sku)}')" title="Verificar stock en vivo contra los servers">⚡</button>
      </span>
    </div>
  </div>`;
}

const fmtQty = n => Number.isInteger(n) ? String(n) : n.toFixed(2);
const cssId = s => s.replace(/[^a-zA-Z0-9_-]/g, '_');
const escAttr = s => String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');

// ═══════════════════════════════════════════════════════════════════
// VERIFICACIÓN EN VIVO (jobs stock_sku → daemons de cada local)
// ═══════════════════════════════════════════════════════════════════
async function verificarEnVivo(sku) {
  const btn = document.getElementById('live-' + cssId(sku));
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }

  const hoy = new Date().toISOString().split('T')[0];
  const jobs = LOCALES.map(l => ({
    local: l, tipo: 'stock_sku', fecha: hoy, parametro: sku,
    estado: 'pendiente', solicitado_por: 'stock_pwa',
  }));

  let ids = [];
  try {
    const { data, error } = await sb.from('dragonfish_jobs').insert(jobs).select('id, local');
    if (error) throw error;
    ids = data || [];
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '⚡'; }
    alert('No pude iniciar la consulta en vivo: ' + e.message);
    return;
  }

  for (const l of LOCALES) marcarChip(sku, l, '⏳…', false);

  const t0 = Date.now();
  const pendientes = new Set(ids.map(r => r.id));
  const porId = Object.fromEntries(ids.map(r => [r.id, r.local]));

  while (pendientes.size > 0 && (Date.now() - t0) < 60000) {
    await new Promise(r => setTimeout(r, 2500));
    try {
      const { data } = await sb.from('dragonfish_jobs')
        .select('id, estado, payload').in('id', [...pendientes]);
      for (const j of (data || [])) {
        if (j.estado === 'completado' && j.payload) {
          pendientes.delete(j.id);
          const l = porId[j.id];
          actualizarChipVivo(sku, l, j.payload);
        } else if (j.estado === 'error') {
          pendientes.delete(j.id);
          marcarChip(sku, porId[j.id], 'sin respuesta', false);
        }
      }
    } catch (_) { /* reintenta en el próximo ciclo */ }
  }
  for (const id of pendientes) marcarChip(sku, porId[id], 'sin respuesta', false);

  if (btn) { btn.disabled = false; btn.textContent = '⚡'; }
}

function actualizarChipVivo(sku, local, payload) {
  const chip = document.getElementById(`chip-${cssId(sku)}-${local}`);
  if (!chip) return;
  const st = parseFloat(payload.stock || 0);
  chip.classList.remove('ok', 'cero');
  chip.classList.add(st > 0 ? 'ok' : 'cero');
  chip.querySelector('.qty').textContent = fmtQty(st);
  const live = chip.querySelector('.live');
  live.textContent = '✓ en vivo';
  live.classList.add('done');
}

function marcarChip(sku, local, texto, done) {
  const chip = document.getElementById(`chip-${cssId(sku)}-${local}`);
  if (!chip) return;
  const live = chip.querySelector('.live');
  live.textContent = texto;
  live.classList.toggle('done', !!done);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(() => {});

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btn-install').style.display = '';
});
document.getElementById('btn-install').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('btn-install').style.display = 'none';
  } else {
    alert('En iPhone: Compartir → "Agregar a pantalla de inicio".');
  }
});
